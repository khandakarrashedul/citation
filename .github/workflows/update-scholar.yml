name: Update Google Scholar citations

on:
  schedule:
    - cron: "0 3 * * *"      # every day at 03:00 UTC
  workflow_dispatch:          # lets you also run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation count
        run: python scripts/update_scholar.py
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Google Scholar citations"
            git push
          fi
